# GrowthLife Product Importer - Shopify app configuration
# Serverless: the app is a static page on GitHub Pages and talks to Shopify
# through App Bridge "Direct API access" (no backend, no API secret).
client_id = "09c53b24dd8804f051a468a5e0f102c5"
name = "GrowthLife Product Importer"
application_url = "https://bkjagan890.github.io/growthlife-product-importer/"
embedded = true

[access_scopes]
scopes = "read_products,write_products,read_inventory,write_inventory,read_locations,read_publications,write_publications,read_files,write_files"

[access.admin]
direct_api_mode = "offline"
embedded_app_direct_api_access = true

[auth]
redirect_urls = ["https://bkjagan890.github.io/growthlife-product-importer/"]

[webhooks]
api_version = "2025-10"

[build]
include_config_on_deploy = true
